<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Cancelled | Solo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#F7F7FB; color:#12121A;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:2rem; }
    .card {
      background:#fff; border:1px solid #E8E8F0; border-radius:24px;
      padding:3rem 2.5rem; max-width:480px; width:100%; text-align:center;
      box-shadow:0 8px 40px rgba(79,70,229,0.06);
    }
    .logo {
      font-size:1.5rem; font-weight:800; letter-spacing:-1px;
      background:linear-gradient(135deg,#4F46E5,#7C3AED);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:2rem; display:block;
    }
    .icon { font-size:3.5rem; margin-bottom:1.5rem; }
    h1 { font-size:1.75rem; margin-bottom:0.75rem; }
    p { color:#6B7280; margin-bottom:2rem; line-height:1.6; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      padding:0.9rem 2rem; border-radius:999px; font-family:inherit;
      font-size:1rem; font-weight:700; cursor:pointer; border:none;
      transition:all 0.25s; text-decoration:none; width:100%; margin-bottom:0.75rem;
    }
    .btn-primary { background:#4F46E5; color:white; }
    .btn-primary:hover { background:#4338CA; transform:translateY(-1px); }
    .btn-ghost { background:transparent; color:#6B7280; border:1.5px solid #E8E8F0; }
    .btn-ghost:hover { color:#4F46E5; border-color:#4F46E5; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">Solo.</a>
    <div class="icon">😕</div>
    <h1>Order Cancelled</h1>
    <p>No worries — your payment was not processed and your cart is still saved. Feel free to go back and continue shopping.</p>
    <a href="/" class="btn btn-primary">← Back to Store</a>
    <a href="/" class="btn btn-ghost">Continue Shopping</a>
  </div>
</body>
</html>
