<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Solo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #4F46E5; --accent-2: #7C3AED;
      --bg: #F7F7FB; --bg-2: #fff;
      --text: #12121A; --text-muted: #6B7280;
      --border: #E8E8F0; --success: #16A34A;
      --font: 'Inter', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .card {
      background:var(--bg-2); border-radius:24px; padding:3rem 2.5rem;
      max-width:560px; width:100%; text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.08); border:1px solid var(--border);
    }
    .icon { font-size:4rem; margin-bottom:1.25rem; }
    h1 { font-size:2rem; font-weight:800; margin-bottom:0.5rem; }
    .sub { color:var(--text-muted); margin-bottom:2rem; font-size:1.05rem; }
    .order-id {
      background:var(--bg); border:1px solid var(--border);
      border-radius:12px; padding:0.85rem 1.5rem;
      font-size:0.9rem; color:var(--text-muted);
      margin-bottom:2rem;
    }
    .order-id strong { color:var(--accent); font-size:1rem; }
    .summary {
      background:var(--bg); border-radius:16px;
      padding:1.5rem; margin-bottom:2rem;
      text-align:left;
    }
    .summary-title { font-weight:700; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:1rem; }
    .summary-row { display:flex; justify-content:space-between; font-size:0.95rem; margin-bottom:0.5rem; }
    .summary-row:last-child { margin-bottom:0; font-weight:800; font-size:1.05rem; border-top:1px solid var(--border); padding-top:0.75rem; margin-top:0.5rem; }
    .cod-badge {
      background:rgba(22,163,74,0.1); color:var(--success);
      border:1px solid rgba(22,163,74,0.2);
      border-radius:999px; padding:0.5rem 1.5rem;
      font-weight:700; font-size:0.95rem;
      display:inline-block; margin-bottom:2rem;
    }
    .wa-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: #25D366; color: white; border: none; border-radius: 999px;
      padding: 0.85rem 1.8rem; font-family: var(--font); font-size: 0.95rem; font-weight: 700;
      text-decoration: none; margin-bottom: 1rem; width: 100%;
      box-shadow: 0 4px 14px rgba(37,211,102,0.3); transition: transform 0.2s, box-shadow 0.2s;
    }
    .wa-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,0.4); }
    .btn-row { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; }
    .back-btn {
      display: inline-block; background: var(--bg); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 0.8rem 2rem; font-family: var(--font);
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: all 0.2s; width: 100%;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-2); }
    #loading { color:var(--text-muted); padding:2rem; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading your order...</div>
    <div id="content" style="display:none">
      <div class="icon">🎉</div>
      <h1>Order Confirmed!</h1>
      <p class="sub">Thank you! We'll contact you shortly to arrange delivery.</p>
      <div class="order-id">Order ID: <strong id="order-id-val"></strong></div>
      <div class="cod-badge">💵 Cash on Delivery</div>
      <div class="summary">
        <div class="summary-title">Order Summary</div>
        <div id="items-list"></div>
        <div class="summary-row"><span>Delivery Location</span><span id="loc-val"></span></div>
        <div class="summary-row"><span>Phone</span><span id="phone-val"></span></div>
        <div class="summary-row"><span>Total</span><span id="total-val"></span></div>
      </div>
      <div class="btn-row">
        <a id="wa-btn" href="#" target="_blank" rel="noopener" class="wa-btn">💬 Chat with Us on WhatsApp</a>
        <a href="/" class="back-btn">← Continue Shopping</a>
      </div>
    </div>
    <div id="error" style="display:none">
      <div class="icon">😕</div>
      <h1>Order not found</h1>
      <p class="sub">The order ID in the URL is invalid.</p>
      <a href="/" class="back-btn">← Back to Store</a>
    </div>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const orderId = params.get('id');

    async function load() {
      if (!orderId) { showError(); return; }
      try {
        const res   = await fetch(`/api/orders/${orderId}`);
        if (!res.ok) { showError(); return; }
        const order = await res.json();

        document.getElementById('order-id-val').textContent = order.orderId;
        document.getElementById('loc-val').textContent      = order.customer.location;
        document.getElementById('phone-val').textContent    = order.customer.phone;
        document.getElementById('total-val').textContent    = `$${Number(order.total).toFixed(2)}`;

        const itemsEl = document.getElementById('items-list');
        order.items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'summary-row';
          row.innerHTML = `<span>${item.name} × ${item.qty}</span><span>$${(item.price * item.qty).toFixed(2)}</span>`;
          itemsEl.appendChild(row);
        });

        const waBtn = document.getElementById('wa-btn');
        const text = encodeURIComponent(`Hello! I just placed order #${order.orderId} for $${Number(order.total).toFixed(2)} to be delivered to ${order.customer.location}.`);
        waBtn.href = `https://wa.me/?text=${text}`;

        document.title = `Order ${order.orderId} | Adounas`;
        document.getElementById('loading').style.display  = 'none';
        document.getElementById('content').style.display  = '';
      } catch(e) { showError(); }
    }


    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display   = '';
    }

    load();
  </script>
</body>
</html>
